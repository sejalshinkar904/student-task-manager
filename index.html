<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="board">
        <h1>Student Task Management System</h1>
        <p class="subtitle">Keep track of your daily college work</p>

        <section class="task-form">
            <input type="text" id="taskName" placeholder="Enter your task">

            <select id="priority">
                <option value="Normal">Normal</option>
                <option value="Important">Important</option>
                <option value="Urgent">Urgent</option>
            </select>

            <button onclick="addTask()">Add</button>
        </section>

        <h2>My Tasks</h2>

        <div id="taskContainer">
            <p class="empty">No tasks added yet.</p>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
